<!doctype html>
<html lang="sq"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pushimet">
<meta name="theme-color" content="#0e5a6b">
<title>Pushimet – Shpenzimet</title>
<link rel="apple-touch-icon" href="pic/expense.png">
<link rel="icon" href="data:image/svg+xl,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌴</text></svg>">
<style>
:root{--bg:#eef3f6;--card:#fff;--tx:#10242c;--mu:#6d8089;--hero:#0e5a6b;--co:#ff6b4a;--ln:#10242c14;--in:#e6edf1}
@media(prefers-color-scheme:dark){:root{--bg:#0a1418;--card:#142228;--tx:#eaf2f5;--mu:#8ea3ac;--hero:#0e5a6b;--ln:#ffffff14;--in:#1d3038}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
.n,.big,.row>span,.dh span:last-child,.tile b{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:14px 0 12px}
.sel{position:relative;display:inline-block;max-width:100%}
.sel select{appearance:none;-webkit-appearance:none;border:0;background:var(--card);color:var(--tx);font:700 20px -apple-system,system-ui,sans-serif;padding:10px 38px 10px 16px;border-radius:16px;max-width:100%}
.sel:after{content:"⌄";position:absolute;right:14px;top:6px;font-size:20px;color:var(--mu);pointer-events:none}
.hero{background:var(--hero);color:#fff;border-radius:26px;padding:22px 22px 20px;margin-bottom:18px}
.hero small{opacity:.75;display:block}
.big{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:4px 0 2px}
.pb{height:8px;border-radius:8px;background:#ffffff30;margin:14px 0 8px;overflow:hidden}
.pb i{display:block;height:100%;background:#fff;border-radius:8px}
.pb i.o{background:var(--co)}
.dh{display:flex;justify-content:space-between;color:var(--mu);font-size:14px;font-weight:600;margin:20px 6px 8px}
.tag{background:var(--co);color:#fff;border-radius:6px;padding:1px 6px;font-size:12px;margin-left:4px}
.card{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--ln);cursor:pointer}
.row:last-child{border:0}.row:active{background:var(--in)}
.row i{font-style:normal;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none}
.row div{flex:1;min-width:0}.row b{display:block;font-weight:600}
.row small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row>span{font-weight:700}
.empty{text-align:center;color:var(--mu);padding:40px 20px}.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
.donut{position:relative;width:220px;height:220px;margin:6px auto 14px}
.donut svg{transform:none}.donut div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut b{font-size:24px}.donut small{color:var(--mu)}
.lg{padding:12px 14px;border-bottom:1px solid var(--ln)}.lg:last-child{border:0}
.lg p{margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}.lg p span:first-child{font-weight:600}
.lg em{font-style:normal;color:var(--mu);font-size:14px}
.lb{height:6px;border-radius:6px;background:var(--in)}.lb i{display:block;height:100%;border-radius:6px}
.bars{display:flex;gap:6px;overflow-x:auto;padding:14px;align-items:flex-end;min-height:170px;-webkit-overflow-scrolling:touch}
.bc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:none;width:40px;font-size:12px;color:var(--mu)}
.bc i{display:block;width:26px;border-radius:8px 8px 4px 4px;background:var(--hero);margin:4px 0;min-height:4px}
.bc b{color:var(--tx);font-size:11px}
@media(prefers-color-scheme:dark){.bc i{background:#2aa3bd}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:18px;padding:14px}.tile small{color:var(--mu);display:block}.tile b{font-size:20px;display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
h3{margin:22px 6px 8px;font-size:14px;color:var(--mu);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--ln)}
nav button{flex:1;max-width:150px;border:0;background:none;color:var(--mu);font:600 12px -apple-system,system-ui,sans-serif;padding:6px 0;border-radius:12px}
nav button span{display:block;font-size:22px}nav button.on{color:var(--hero)}
@media(prefers-color-scheme:dark){nav button.on{color:#5cc6dc}}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:22px;border:0;background:var(--co);color:#fff;font-size:34px;line-height:1;box-shadow:0 10px 24px #ff6b4a66}
.fab:active{transform:scale(.94)}
#sh{position:fixed;inset:0;z-index:9;pointer-events:none}
#sh .bd{position:absolute;inset:0;background:#0008;opacity:0;transition:.25s}
#sh .sp{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#sh.on{pointer-events:auto}#sh.on .bd{opacity:1}#sh.on .sp{transform:none}
.sp h2{margin:0 0 14px;font-size:22px}
.amt{display:flex;align-items:center;background:var(--in);border-radius:18px;padding:6px 16px;margin-bottom:14px;border:2px solid transparent}
.amt.err{border-color:var(--co)}
.amt input{flex:1;min-width:0;border:0;background:none;color:var(--tx);font:800 40px ui-rounded,system-ui,sans-serif;padding:6px 0;outline:0}
.amt span{font-size:32px;color:var(--mu);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:2px solid transparent;background:var(--in);color:var(--tx);border-radius:14px;padding:9px 13px;font:600 15px -apple-system,system-ui,sans-serif}
.chip.on{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:var(--c)}
label{display:block;color:var(--mu);font-size:13px;font-weight:600;margin-bottom:12px}
label input,label select{display:block;width:100%;margin-top:5px;border:0;background:var(--in);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding:13px 14px;border-radius:14px;min-height:48px;appearance:none;-webkit-appearance:none}
input[type=color]{padding:4px!important;height:48px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font:700 17px -apple-system,system-ui,sans-serif;background:var(--hero);color:#fff;margin-top:6px}
.btn.del{background:none;color:#e5484d}.btn.gr{background:var(--in);color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add{display:block;width:100%;border:0;background:none;color:var(--hero);font:700 16px -apple-system,system-ui,sans-serif;padding:14px}
@media(prefers-color-scheme:dark){.add{color:#5cc6dc}}
#toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#10242ce6;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
</style></head>
<body>
<div id="app"></div>
<button class="fab" onclick="openExp()" aria-label="Shto shpenzim">+</button>
<nav>
<button data-t="l" onclick="go('l')"><span>🧾</span>Shpenzimet</button>
<button data-t="c" onclick="go('c')"><span>📊</span>Grafikët</button>
<button data-t="m" onclick="go('m')"><span>⚙️</span>Më shumë</button>
</nav>
<div id="sh"></div><div id="toast"></div>
<script>
const KEY='pushimet-v1',M=['Jan','Shk','Mar','Pri','Maj','Qer','Kor','Gus','Sht','Tet','Nën','Dhj'],
DN=['E diel','E hënë','E martë','E mërkurë','E enjte','E premte','E shtunë'],
DC=[['food','Ushqim','🍽️','#f97316'],['trans','Transport','🚕','#3b82f6'],['stay','Strehim','🏨','#8b5cf6'],['act','Aktivitete','🎟️','#10b981'],['shop','Blerje','🛍️','#ec4899'],['other','Tjetër','✨','#64748b']];
const $=s=>document.querySelector(s),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
eur=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €',
uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3),
today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},
fdt=s=>{if(!s)return'';const[y,m,d]=s.split('-');return+d+' '+M[m-1]+' '+y};
let S=null,tab='l',sc='';
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.exp))S={trips:[],cats:DC.map(([id,name,icon,color])=>({id,name,icon,color})),exp:[],cur:'all'};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Nuk u ruajt! Bëj Eksport.')}};
const T=id=>S.trips.find(t=>t.id===id),
C=id=>S.cats.find(c=>c.id===id)||{name:'Tjetër',icon:'✨',color:'#64748b'},
list=()=>S.exp.filter(e=>S.cur==='all'||e.trip===S.cur).sort((a,b)=>b.date.localeCompare(a.date)||b.t-a.t);
if(S.cur!=='all'&&!T(S.cur))S.cur='all';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function go(t){tab=t;render();scrollTo(0,0)}

function render(){
 const L=list(),tot=L.reduce((s,e)=>s+e.amt,0),tr=S.cur==='all'?null:T(S.cur);
 let h=`<header><div class="sel"><select onchange="S.cur=this.value;save();render()"><option value="all">Të gjitha udhëtimet</option>${S.trips.map(t=>`<option value="${t.id}"${t.id===S.cur?' selected':''}>${esc(t.name)}</option>`).join('')}</select></div></header>`;
 if(tab!=='m'){
  h+=`<div class="hero"><small>${tr?esc(tr.name)+(tr.start?' · '+fdt(tr.start)+(tr.end?' – '+fdt(tr.end):''):''):'Të gjitha shpenzimet'}</small><div class="big">${eur(tot)}</div>`;
  if(tr&&tr.budget>0){const r=tr.budget-tot;h+=`<div class="pb"><i class="${r<0?'o':''}" style="width:${Math.min(100,tot/tr.budget*100)}%"></i></div><small>Buxheti ${eur(tr.budget)} · ${r>=0?'mbeten '+eur(r):'tejkaluar me '+eur(-r)}</small>`}
  else h+=`<small>${L.length} shpenzime</small>`;
  h+=`</div>`;
 }
 h+=tab==='l'?listV(L,tr):tab==='c'?chartV(L,tot,tr):moreV();
 $('#app').innerHTML=h;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 document.querySelector('.fab').style.display=tab==='m'?'none':'';
}

function listV(L,tr){
 if(!L.length)return`<div class="empty"><b>Ende pa shpenzime</b>${S.trips.length?'Shtyp + për të regjistruar të parin.':'Krijo një udhëtim te “Më shumë”, ose shtyp + dhe regjistro direkt.'}</div>`;
 const g={};L.forEach(e=>(g[e.date]=g[e.date]||[]).push(e));
 return Object.keys(g).sort().reverse().map(d=>{
  const dt=new Date(d+'T12:00'),t=T(g[d][0].trip),pre=S.cur!=='all'&&tr&&tr.start&&d<tr.start;
  return`<div class="dh"><span>${DN[dt.getDay()]}, ${fdt(d)}${pre?'<b class="tag">para udhëtimit</b>':''}</span><span>${eur(g[d].reduce((s,e)=>s+e.amt,0))}</span></div><div class="card">`+
  g[d].map(e=>{const c=C(e.cat),tp=S.cur==='all'&&T(e.trip);return`<div class="row" onclick="openExp('${e.id}')"><i style="background:${c.color}2b">${c.icon}</i><div><b>${esc(c.name)}</b><small>${esc([tp&&tp.name,e.note].filter(Boolean).join(' · '))}</small></div><span>${eur(e.amt)}</span></div>`}).join('')+`</div>`}).join('');
}

function chartV(L,tot,tr){
 if(!L.length)return`<div class="empty"><b>Nuk ka çfarë të tregoj</b>Shto disa shpenzime dhe grafikët shfaqen këtu.</div>`;
 const bc={},bd={};L.forEach(e=>{bc[e.cat]=(bc[e.cat]||0)+e.amt;bd[e.date]=(bd[e.date]||0)+e.amt});
 const cs=Object.entries(bc).sort((a,b)=>b[1]-a[1]),ds=Object.keys(bd).sort(),mx=Math.max(...Object.values(bd));
 let off=25;
 const seg=cs.map(([id,v])=>{const p=v/tot*100,s=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${C(id).color}" stroke-width="5.5" stroke-dasharray="${Math.max(p-.6,.1)} ${100-Math.max(p-.6,.1)}" stroke-dashoffset="${off}"/>`;off-=p;return s}).join('');
 const big=L.reduce((a,b)=>b.amt>a.amt?b:a),top=C(cs[0][0]);
 const pre=tr&&tr.start?L.filter(e=>e.date<tr.start).reduce((s,e)=>s+e.amt,0):0;
 return`<div class="card" style="padding:16px 14px 6px"><div class="donut"><svg viewBox="0 0 42 42">${seg}</svg><div><b class="n">${eur(tot)}</b><small>${cs.length} kategori</small></div></div></div>
 <div class="card">${cs.map(([id,v])=>{const c=C(id),p=v/tot*100;return`<div class="lg"><p><span>${c.icon} ${esc(c.name)}</span><span class="n">${eur(v)} <em>${p.toFixed(0)}%</em></span></p><div class="lb"><i style="width:${p}%;background:${c.color}"></i></div></div>`}).join('')}</div>
 <h3>Sipas ditës</h3><div class="card"><div class="bars">${ds.map(d=>`<div class="bc"><b>${Math.round(bd[d])}</b><i style="height:${Math.max(4,bd[d]/mx*100)}px"></i>${+d.slice(8)}/${+d.slice(5,7)}</div>`).join('')}</div></div>
 <div class="tiles"><div class="tile"><small>Mesatare ditore</small><b>${eur(tot/ds.length)}</b></div><div class="tile"><small>Më shumë në</small><b>${top.icon} ${esc(top.name)}</b></div><div class="tile"><small>Shpenzimi më i madh</small><b>${eur(big.amt)}</b></div><div class="tile"><small>Ditë me shpenzime</small><b>${ds.length}</b></div>${pre>0?`<div class="tile"><small>Para udhëtimit</small><b>${eur(pre)}</b></div><div class="tile"><small>Gjatë udhëtimit</small><b>${eur(tot-pre)}</b></div>`:''}</div>`;
}

function moreV(){
 return`<h3>Udhëtimet</h3><div class="card">${S.trips.map(t=>`<div class="row" onclick="openTrip('${t.id}')"><i style="background:var(--in)">🌴</i><div><b>${esc(t.name)}</b><small>${t.start?fdt(t.start)+(t.end?' – '+fdt(t.end):''):'pa data'}${t.budget>0?' · buxheti '+eur(+t.budget):''}</small></div></div>`).join('')}<button class="add" onclick="openTrip()">+ Udhëtim i ri</button></div>
 <h3>Kategoritë</h3><div class="card">${S.cats.map(c=>`<div class="row" onclick="openCat('${c.id}')"><i style="background:${c.color}2b">${c.icon}</i><div><b>${esc(c.name)}</b></div></div>`).join('')}<button class="add" onclick="openCat()">+ Kategori e re</button></div>
 <h3>Të dhënat (${S.exp.length} shpenzime)</h3><div class="card" style="padding:12px"><button class="btn" onclick="exportJ()">Eksporto JSON</button><button class="btn gr" onclick="$('#imp').click()">Importo JSON</button><input id="imp" type="file" accept=".json,application/json" hidden onchange="importJ(this)"><button class="btn del" onclick="resetAll()">Fshi gjithçka</button></div>
 <p style="color:var(--mu);font-size:13px;margin:8px 8px 0">Të dhënat ruhen vetëm në këtë telefon. Eksporto herë pas here një kopje rezervë.</p>`;
}

function sheet(h){const s=$('#sh');s.innerHTML=`<div class="bd" onclick="cl()"></div><div class="sp">${h}</div>`;requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('on')))}
function cl(){$('#sh').classList.remove('on');document.activeElement&&document.activeElement.blur()}

function openExp(id){
 const e=id?S.exp.find(x=>x.id===id):{cat:S.cats[0].id,date:today(),trip:S.cur!=='all'?S.cur:(S.trips[0]?S.trips[0].id:''),note:'',amt:''};
 sc=e.cat;
 sheet(`<h2>${id?'Ndrysho shpenzimin':'Shpenzim i ri'}</h2>
 <div class="amt"><input id="i_a" inputmode="decimal" placeholder="0,00" autocomplete="off" value="${e.amt!==''?String(e.amt).replace('.',','):''}"><span>€</span></div>
 <div class="chips">${S.cats.map(c=>`<button type="button" class="chip${c.id===sc?' on':''}" style="--c:${c.color}" onclick="pick(this,'${c.id}')">${c.icon} ${esc(c.name)}</button>`).join('')}</div>
 <div class="two"><label>Data<input type="date" id="i_d" value="${e.date}"></label>
 <label>Udhëtimi<select id="i_t"><option value="">Pa udhëtim</option>${S.trips.map(t=>`<option value="${t.id}"${t.id===e.trip?' selected':''}>${esc(t.name)}</option>`).join('')}</select></label></div>
 <label>Shënim<input id="i_n" maxlength="80" placeholder="p.sh. darka në port" value="${esc(e.note)}"></label>
 <button class="btn" onclick="saveExp('${id||''}')">Ruaj</button>${id?`<button class="btn del" onclick="delExp('${id}')">Fshi shpenzimin</button>`:''}`);
 if(!id)setTimeout(()=>$('#i_a').focus(),350);
}
function pick(b,id){sc=id;b.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))}
function saveExp(id){
 const a=parseFloat($('#i_a').value.replace(',','.'));
 if(!(a>0)){$('#i_a').parentNode.classList.add('err');$('#i_a').focus();return}
 const o={amt:Math.round(a*100)/100,cat:sc,date:$('#i_d').value||today(),trip:$('#i_t').value,note:$('#i_n').value.trim()};
 if(id)Object.assign(S.exp.find(x=>x.id===id),o);else S.exp.push({id:uid(),t:Date.now(),...o});
 save();cl();render();toast('U ruajt')
}
function delExp(id){if(confirm('Ta fshij këtë shpenzim?')){S.exp=S.exp.filter(x=>x.id!==id);save();cl();render()}}

function openTrip(id){
 const t=id?T(id):{name:'',start:today(),end:'',budget:''};
 sheet(`<h2>${id?'Ndrysho udhëtimin':'Udhëtim i ri'}</h2>
 <label>Emri<input id="t_n" maxlength="40" placeholder="p.sh. Pushime në Sarandë" value="${esc(t.name)}"></label>
 <div class="two"><label>Fillon<input type="date" id="t_s" value="${t.start||''}"></label><label>Mbaron<input type="date" id="t_e" value="${t.end||''}"></label></div>
 <label>Buxheti i planifikuar (€)<input id="t_b" inputmode="decimal" placeholder="opsionale" value="${t.budget||''}"></label>
 <button class="btn" onclick="saveTrip('${id||''}')">Ruaj</button>${id?`<button class="btn del" onclick="delTrip('${id}')">Fshi udhëtimin</button>`:''}`);
}
function saveTrip(id){
 const n=$('#t_n').value.trim();if(!n){$('#t_n').focus();return}
 const o={name:n,start:$('#t_s').value,end:$('#t_e').value,budget:parseFloat($('#t_b').value.replace(',','.'))||0};
 if(id)Object.assign(T(id),o);else{const t={id:uid(),...o};S.trips.push(t);S.cur=t.id}
 save();cl();render()
}
function delTrip(id){
 const n=S.exp.filter(e=>e.trip===id).length;
 if(confirm('Ta fshij udhëtimin'+(n?' dhe '+n+' shpenzimet e tij':'')+'?')){S.exp=S.exp.filter(e=>e.trip!==id);S.trips=S.trips.filter(t=>t.id!==id);if(S.cur===id)S.cur='all';save();cl();render()}
}

function openCat(id){
 const c=id?S.cats.find(x=>x.id===id):{name:'',icon:'🛒',color:'#0ea5e9'};
 sheet(`<h2>${id?'Ndrysho kategorinë':'Kategori e re'}</h2>
 <div class="two"><label>Emoji<input id="c_i" maxlength="4" value="${c.icon}"></label><label>Ngjyra<input type="color" id="c_c" value="${c.color}"></label></div>
 <label>Emri<input id="c_n" maxlength="24" value="${esc(c.name)}"></label>
 <button class="btn" onclick="saveCat('${id||''}')">Ruaj</button>${id?`<button class="btn del" onclick="delCat('${id}')">Fshi kategorinë</button>`:''}`);
}
function saveCat(id){
 const n=$('#c_n').value.trim();if(!n){$('#c_n').focus();return}
 const o={name:n,icon:$('#c_i').value.trim()||'•',color:$('#c_c').value};
 if(id)Object.assign(S.cats.find(x=>x.id===id),o);else S.cats.push({id:uid(),...o});
 save();cl();render()
}
function delCat(id){
 if(S.exp.some(e=>e.cat===id)){alert('Kjo kategori ka shpenzime. Ndryshoji së pari ato në një kategori tjetër.');return}
 if(S.cats.length<2){alert('Duhet të mbetet të paktën një kategori.');return}
 if(confirm('Ta fshij kategorinë?')){S.cats=S.cats.filter(c=>c.id!==id);save();cl();render()}
}

async function exportJ(){
 const name='pushimet-'+today()+'.json',blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
 try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('U eksportua')
}
function importJ(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.exp)||!Array.isArray(d.trips)||!Array.isArray(d.cats))throw 0;
  if(confirm('Importo '+d.exp.length+' shpenzime? Të dhënat aktuale do zëvendësohen.')){S={cur:'all',...d};save();render();toast('U importua')}}catch(e){alert('Skedari nuk është i vlefshëm.')}inp.value=''};
 r.readAsText(f)
}
function resetAll(){if(confirm('Të fshihen të gjitha të dhënat? Kjo nuk kthehet pas.')&&confirm('Je i sigurt?')){localStorage.removeItem(KEY);location.reload()}}
render();
</script>
